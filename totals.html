<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BYLT / Totals</title>
<link rel="stylesheet" href="style.css">
<script src="auth-check.js"></script>
</head>
<body>

<header class="topbar">
  <div class="brand">BYLT</div>
  <nav>
    <a href="index.html">Order Status</a>
    <a href="integrations.html">Integrations Status</a>
    <a href="integration-health.html">Integration Health</a>
    <a href="load-data.html">Load Data</a>
    <a href="totals.html" class="current">Totals</a>
    <a href="#" id="logoutLink" style="margin-left:24px;">Log out</a>
  </nav>
</header>
<div class="crumbline" style="display:flex; justify-content:space-between; align-items:flex-end; gap:16px; flex-wrap:wrap;">
  <div>
    <h1>Totals</h1>
    <div class="path" id="asOf">Loading…</div>
  </div>
  <button class="ghost" id="refreshBtn">Refresh</button>
</div>

<main>
  <div class="panel">
    <div class="table-wrap" style="max-height:none;">
      <table>
        <thead>
          <tr>
            <th>Area</th>
            <th>Total in NetSuite</th>
            <th>2nd System</th>
            <th>Total Missing</th>
            <th>Discrepancies</th>
            <th>Status</th>
          </tr>
        </thead>
        <tbody id="totals-body"></tbody>
      </table>
    </div>
  </div>
</main>

<script src="app.js"></script>
<script>
const tbody = document.getElementById('totals-body');
let latest = null;

document.getElementById('logoutLink').addEventListener('click', (e)=>{ e.preventDefault(); logout(); });
document.getElementById('refreshBtn').addEventListener('click', ()=>init());

async function init(){
  tbody.innerHTML = '';
  latest = null;
  const shared = await loadSharedResults();

  SECTIONS.forEach(s=>{
    let result = null, savedAt = null;
    if(shared[s.id]){
      result = shared[s.id].result;
      savedAt = shared[s.id].savedAt;
    } else {
      result = loadSectionResult(s.id);
      savedAt = loadSectionSavedAt(s.id);
    }
    if(savedAt && (!latest || savedAt > latest)) latest = savedAt;

    const tr = document.createElement('tr');
    if(result){
      const missingCls = result.totalMissing > 0 ? 'diff-neg' : 'diff-pos';
      const discCls = result.discrepancies.length > 0 ? 'diff-neg' : 'diff-pos';
      const avCell = s.sourceOfTruth === 'netsuite'
        ? `${result.matchedCount.toLocaleString()} <span style="color:var(--muted); font-size:11px;">matched</span>`
        : `${result.totalAv.toLocaleString()} <span style="color:var(--muted); font-size:11px;">total</span>`;
      tr.innerHTML = `
        <td><strong>${s.title}</strong></td>
        <td>${result.totalNs.toLocaleString()}</td>
        <td>${avCell}</td>
        <td class="${missingCls}">${result.totalMissing.toLocaleString()}</td>
        <td class="${discCls}">${result.discrepancies.length.toLocaleString()}</td>
        <td><span class="status-pill ready">Loaded</span></td>
      `;
    } else {
      tr.innerHTML = `
        <td><strong>${s.title}</strong></td>
        <td>—</td><td>—</td><td>—</td><td>—</td>
        <td><span class="status-pill">Not loaded</span></td>
      `;
    }
    tbody.appendChild(tr);
  });

  document.getElementById('asOf').textContent = latest
    ? `Last updated ${new Date(latest).toLocaleString()}`
    : `No data loaded yet — go to Load Data to get started.`;
}
init();
</script>
</body>
</html>
